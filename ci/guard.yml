# kagami 가드: kagami src/guard.ts judge를 대상 저장소(팀 저장소)의 PR마다 돌려 빨강·초록·표시로 보인다.
# kagami 저장소 자신의 CI(.github/workflows/ci.yml)와는 다르다. 읽기 토큰만 쓰고 GitHub에 아무것도 쓰지 않는다.
# dev 머지는 CI 초록 + TL;DR + 사람의 동의일 때만 한다(AGENTS.md). PR이 이 파일을 고치면 결과도 바뀐다
# (pull_request는 PR 쪽 워크플로로 돈다). 그래서 사람이 머지 전에 이 파일의 diff를 본다.
# 계약 정리: contract-change 라벨과 본문 TL;DR의 Changed 줄을 이벤트 payload에서 읽는다. 라벨·본문을 바꾸면 다시 돈다
#
# 까는 법(사람이 한다. 대상 저장소에서도 .github/workflows/는 위험 경로다):
#   1. 이 파일을 대상 저장소의 .github/workflows/kagami-guard.yml로 복사해 사람 PR로 dev에 넣는다
#   2. 저장소 비밀 KAGAMI_READ_TOKEN = Pancheble/kagami만 Contents: Read인 fine-grained 토큰(kagami가 비공개라서)
name: kagami guard

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0 # judge가 origin/dev와 비교한다. HEAD는 PR을 dev에 얹은 머지 커밋
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Pancheble/kagami
          ref: dev
          path: kagami
          token: ${{ secrets.KAGAMI_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: kagami
      - run: node kagami/src/guard.ts --dir repo
