# kagami guard: runs kagami src/guard.ts judge on every PR of the target repo (the team repo) and shows red, green or a flag.
# Not the same as the kagami repo's own CI (.github/workflows/ci.yml). It uses a read token only and writes nothing to GitHub.
# Merge into dev only with CI green + a TL;DR + the human's consent (AGENTS.md). If a PR edits this file, the result changes too
# (pull_request runs the PR side's workflow). So the human reads this file's diff before merging.
# Contract cleanup: reads the contract-change label and the Changed line of the body TL;DR from the event payload. Changing the label or body reruns it
#
# How to install: /kagami:init (src/init.ts) writes this file to the target repo as .github/workflows/kagami-guard.yml.
#   It then changes the repository and ref lines of the kagami checkout below to the kagami ref the target repo pins (the same one as .claude/settings.json).
#   The dev ref written here is the value for copying by hand (there are no tags before v1.0.0). In the target repo, .github/workflows/ is a risk path too
# For the human: repo secret KAGAMI_READ_TOKEN = a fine-grained token with Contents: Read on Pancheble/kagami only (while kagami is private, before #52)
name: kagami guard

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0 # judge compares with origin/dev. HEAD is the merge commit of the PR on top of dev
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Pancheble/kagami
          ref: dev
          path: kagami
          token: ${{ secrets.KAGAMI_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: kagami
      - run: node kagami/src/guard.ts --dir repo
